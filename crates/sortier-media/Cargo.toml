[package]
name = "sortier-media"
description = "Decodes stills, animations, video and sound."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
image.workspace = true
png.workspace = true
ffmpeg-next.workspace = true
ffmpeg-sys-next.workspace = true
cpal.workspace = true
hayro.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
roxmltree.workspace = true

# Where FFmpeg comes from, with each system's graphics card decoders. Windows links vcpkg's static build (which
# enables D3D11VA and DXVA2), because building FFmpeg's configure script with MSVC needs MSYS2 and a Visual Studio
# prompt; `static` makes ffmpeg-sys-next ask vcpkg for static libraries rather than DLLs. The others build it from
# source (the `build-*` features turn on `build`).
[target.'cfg(target_os = "macos")'.dependencies]
ffmpeg-sys-next = { workspace = true, features = ["build-videotoolbox"] }

[target.'cfg(target_os = "windows")'.dependencies]
ffmpeg-sys-next = { workspace = true, features = ["static"] }

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-sys-next = { workspace = true, features = ["build-vaapi"] }

[dev-dependencies]
tempfile.workspace = true
zip = { workspace = true, features = ["deflate"] }
openh264.workspace = true
mp4.workspace = true
sevenz-rust2 = { workspace = true, features = ["compress", "util"] }
